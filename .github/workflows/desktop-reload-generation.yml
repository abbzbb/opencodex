name: Desktop reload-generation contract

on:
  pull_request:
    paths:
      - "desktop/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/desktop-reload-generation.yml"
      - ".github/actions/setup-project-bun/action.yml"
  push:
    branches: [main, preview, dev]
    paths:
      - "desktop/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/desktop-reload-generation.yml"
      - ".github/actions/setup-project-bun/action.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-reload-generation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-lib-contract:
    name: desktop rust lib tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-project-bun

      - name: Linux Tauri compile deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libssl-dev

      - name: Select Rust 1.88.0
        shell: bash
        run: |
          set -euo pipefail
          command -v rustup
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup run 1.88.0 rustc --version
          rustup run 1.88.0 cargo --version

      - name: Desktop Rust lib tests (authoritative)
        shell: bash
        run: rustup run 1.88.0 cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --lib

      - name: Focused reload-generation Bun regression
        shell: bash
        run: bun test ./desktop/tests/probe-a-reload-generation.test.ts

      - name: Source-sentinel probe (not physical WebView proof)
        shell: bash
        run: |
          set -euo pipefail
          out="$(bun desktop/scripts/probe-a-reload-generation.ts)"
          echo "$out"
          echo "$out" | grep -F '"kind":"source-sentinel"'
          echo "$out" | grep -F '"authoritativeCommand":"cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --lib"'
          echo "$out" | grep -F '"physicalWebviewEvidence":false'
          echo "$out" | grep -F '"windowsWebView2NavigateFinished":false'
